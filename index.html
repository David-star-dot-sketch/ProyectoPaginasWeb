<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belle Étoile - Salón de Belleza</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
          <a class="navbar-brand" href="#">Belle Étoile</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#agenda">Agenda</a></li>
              <li class="nav-item"><a class="nav-link" href="#servicios">Servicios</a></li>
              <li class="nav-item"><a class="nav-link" href="#promociones">Promociones</a></li>
              <li class="nav-item"><a class="nav-link" href="#testimonios">Testimonios</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <header class="hero-section text-white d-flex align-items-center" style="background: linear-gradient(to right, #f5b5c8, #ffd9ec); height: 80vh;">
        <div class="container text-center">
          <h1 class="display-4">Descubre tu Belleza Interior</h1>
          <p class="lead">Reserva tu cita y déjate consentir en Belle Étoile</p>
          <a href="#agenda" class="btn btn-primary btn-lg">Agendar Ahora</a>
        </div>
      </header>

      <section id="agenda" class="py-5">
        <div class="container">
          <h2 class="text-center mb-4">Agenda tu Cita</h2>


          <div id="mensaje-exito" class="alert alert-success text-center d-none" role="alert">
            ¡Su cita ha sido agendada con éxito!
          </div>

          <form id="form-cita" class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Nombre Completo" required>
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control" placeholder="Correo Electrónico" required>
            </div>
            <div class="col-md-6">
              <select class="form-select" required>
                <option selected disabled>Selecciona un Servicio</option>
                <option>Peinado</option>
                <option>Manicure</option>
                <option>Coloración</option>
                <option>Tratamiento Facial</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="date" class="form-control" required>
            </div>
            <div class="col-md-3">
              <input type="time" class="form-control" required>
            </div>
            <div class="col-12 text-center">
              <button type="submit" class="btn btn-primary">Reservar Cita</button>
            </div>
          </form>
        </div>
      </section>






    
</body>
</html>
